name: Deploy Enviroweather Fleet

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'backend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS runners were not acquired for the October 5 release; Ubuntu runners build the static artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify syntax, diagnostics and access controls
        run: node scripts/check-syntax.mjs && node --test backend/tests/*.test.mjs

      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp -R web/. _site/
          short="${GITHUB_SHA::7}"
          sed -i "s|<meta name=\"fleet-release\" content=\"dev\">|<meta name=\"fleet-release\" content=\"${short}\">|" _site/index.html
          grep -q "content=\"${short}\"" _site/index.html
          node scripts/stamp-release.mjs _site "${short}"
          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/release.json
          printf 'atolldb.com\n' > _site/CNAME
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
